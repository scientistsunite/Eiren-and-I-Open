name: One-time Eiren & I release-description correction

on:
  push:
    branches:
      - maintenance/release-description-fix-20261030
    paths:
      - '.github/workflows/release-description-fix-once.yml'

permissions:
  contents: write

jobs:
  update-reviewed-release-descriptions:
    if: ${{ github.repository == 'scientistsunite/Eiren-and-I-Open' && github.ref == 'refs/heads/maintenance/release-description-fix-20261030' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate and update the eight existing release descriptions only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_description_fix_once.py
