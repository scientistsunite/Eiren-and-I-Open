name: One-time public release download links
on:
  push:
    branches: [main]
    paths: [.github/workflows/public-release-download-links-20261030.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-only-seven-release-descriptions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Append validated asset links after intended-use paragraphs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request

          REPO = "scientistsunite/Eiren-and-I-Open"
          API = f"https://api.github.com/repos/{REPO}"
          REQUEST_HEADERS = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "EirenPublicReleaseAssetLinkUpdater",
          }
          TARGETS = {
              "system-chronicle-windows-v0.4.4": [
                  ("Windows installer", "SystemChronicle-Windows-0.4.4-Setup.exe"),
                  ("SHA-256 checksums", "system-chronicle-windows-v0.4.4-SHA256SUMS.txt"),
              ],
              "system-chronicle-ubuntu-v0.4": [
                  ("Ubuntu installable ZIP", "System-Chronicle-Ubuntu-v0.4-Installable.zip"),
                  ("SHA-256 checksums", "system-chronicle-ubuntu-v0.4-SHA256SUMS.txt"),
              ],
              "silent-meteor-windows-v0.4.0": [
                  ("Windows installer", "Silent-Meteor-Windows-v0.4.0-Setup.exe"),
                  ("Portable ZIP", "Silent-Meteor-Windows-v0.4.0-Portable.zip"),
                  ("SHA-256 checksums", "silent-meteor-windows-v0.4.0-SHA256SUMS.txt"),
              ],
              "silent-meteor-ubuntu-v0.5.16": [
                  ("Ubuntu .deb", "silent-meteor_0.5.16_all.deb"),
                  ("Installer ZIP", "Silent-Meteor-Ubuntu-v0.5.16-Complete-Installers.zip"),
                  ("SHA-256 checksums", "silent-meteor-ubuntu-v0.5.16-SHA256SUMS.txt"),
              ],
              "battery-charge-control-ubuntu-5-point-offset": [
                  ("Source-based Ubuntu installer ZIP", "Battery-Charge-Control-Ubuntu-5-Point-Offset-Complete.zip"),
                  ("SHA-256 checksums", "battery-charge-control-ubuntu-5-point-offset-SHA256SUMS.txt"),
              ],
              "archive-reader-windows-v0.11": [
                  ("Portable Windows Python ZIP", "ChatGPT_Archive_Viewer_v0.11_Unlimited_Search_Pagination.zip"),
                  ("SHA-256 checksums", "archive-reader-windows-v0.11-SHA256SUMS.txt"),
              ],
              "archive-reader-ubuntu-v0.11": [
                  ("Ubuntu .deb", "chatgpt-archive-viewer_0.11.0-ubuntu1_all.deb"),
                  ("Portable Ubuntu ZIP", "ChatGPT_Archive_Viewer_v0.11_Ubuntu_Portable.zip"),
                  ("SHA-256 checksums", "archive-reader-ubuntu-v0.11-SHA256SUMS.txt"),
              ],
          }
          def call(method, suffix, payload=None):
              body = None if payload is None else json.dumps(payload, ensure_ascii=False).encode("utf-8")
              headers = dict(REQUEST_HEADERS)
              if body is not None:
                  headers["Content-Type"] = "application/json; charset=utf-8"
              req = urllib.request.Request(f"{API}{suffix}", data=body, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)

          releases = call("GET", "/releases?per_page=100")
          indexed = {r["tag_name"]: r for r in releases}
          if len(indexed) != len(releases) or not TARGETS.keys() <= indexed.keys():
              raise SystemExit("Required seven release tags absent or duplicate; refusing to edit.")
          if "cylon-detector-windows-v0.1.0" not in indexed or "cylon-raider-windows-v0.4.0" not in indexed:
              raise SystemExit("Expected existing releases absent; refusing to edit.")

          def invariant(r):
              return (r["id"], r["tag_name"], r["name"], r["draft"], r["prerelease"],
                      tuple(sorted((a["id"], a["name"], a["size"], a.get("digest")) for a in r["assets"])))

          original = {tag: (r["body"], invariant(r)) for tag, r in indexed.items()}
          proposed = {}
          for tag, link_spec in TARGETS.items():
              r = indexed[tag]
              body = r.get("body")
              if not isinstance(body, str):
                  raise SystemExit(f"No release text: {tag}")
              sep = "\r\n" if "\r\n" in body else "\n"
              heading = "## Intended use" + sep
              if body.count(heading) != 1:
                  raise SystemExit(f"Expected one intended-use section: {tag}")
              para_start = body.index(heading) + len(heading)
              para_end = body.find(sep + sep, para_start)
              if para_end <= para_start or sep in body[para_start:para_end]:
                  raise SystemExit(f"Unexpected intended-use paragraph: {tag}")
              insert_at = para_end + 2 * len(sep)
              if "**Downloads:**" in body[:insert_at+500]:
                  raise SystemExit(f"Unexpected pre-existing links: {tag}")
              assets = {a["name"]: a for a in r["assets"]}
              texts = []
              for label, filename in link_spec:
                  a = assets.get(filename)
                  if a is None or a["size"] <= 0 or not re.fullmatch(r"sha256:[a-f0-9]{64}", a.get("digest") or ""):
                      raise SystemExit(f"Missing or unsigned hash metadata: {tag}/{filename}")
                  url = a["browser_download_url"]
                  expected = f"https://github.com/{REPO}/releases/download/{tag}/"
                  if not url.startswith(expected) or not url.endswith("/" + filename):
                      raise SystemExit(f"Unexpected download URL: {tag}/{filename}")
                  texts.append(f"[{label}]({url})")
              addition = "**Downloads:** " + " · ".join(texts) + sep + sep
              proposed[tag] = body[:insert_at] + addition + body[insert_at:]
              if proposed[tag].replace(addition, "", 1) != body:
                  raise SystemExit(f"Original release content would change: {tag}")
          print("Preflight PASS: all seven releases, link targets and exact insertion-only changes verified.")

          for tag, desired in proposed.items():
              r = indexed[tag]
              fresh = call("GET", f"/releases/{r['id']}")
              if fresh["body"] != original[tag][0] or invariant(fresh) != original[tag][1]:
                  raise SystemExit(f"Release changed during operation; stopped before editing {tag}")
              updated = call("PATCH", f"/releases/{r['id']}", {"body": desired})
              if updated["body"] != desired or invariant(updated) != original[tag][1]:
                  raise SystemExit(f"Post-update verification failed: {tag}")
              print(f"PASS: inserted direct links in {tag} without altering other text or assets.")

          refreshed = {r["tag_name"]: r for r in call("GET", "/releases?per_page=100")}
          if refreshed.keys() != indexed.keys():
              raise SystemExit("Release inventory changed during operation.")
          for tag, (original_body, original_invariant) in original.items():
              now = refreshed[tag]
              if invariant(now) != original_invariant:
                  raise SystemExit(f"Other release metadata unexpectedly changed: {tag}")
              expected = proposed[tag] if tag in proposed else original_body
              if now["body"] != expected:
                  raise SystemExit(f"Unexpected release text after operation: {tag}")
          print("SUCCESS: Seven additions only; other two release descriptions unchanged; all release assets, names and tags preserved.")
          PY