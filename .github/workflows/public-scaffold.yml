name: Public scaffold validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify expected files
        run: python3 testing/scripts/verify_structure.py
