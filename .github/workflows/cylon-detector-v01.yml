name: Cylon Detector v0.1 initial Windows installer

on:
  push:
    branches: [cylon-detector-v01, main]
    paths: ['Cylon-Detector/**', '.github/workflows/cylon-detector-v01.yml']
  pull_request:
    paths: ['Cylon-Detector/**', '.github/workflows/cylon-detector-v01.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cylon-detector-v01-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      SourceRevisionId: ${{ github.sha }}
      DETECTOR_UX_FIXTURE: github-hosted-disposable
    defaults:
      run:
        shell: pwsh
        working-directory: Cylon-Detector/Windows
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build, verify UI and unchanged measurement/history contracts, package installer
        run: ./packaging/v01/build.ps1
      - name: Inspectable synthetic preview evidence
        if: always()
        run: |
          # These images are rendered from the isolated synthetic application only.
          # Text evidence permits reviewing selected previews without a desktop session.
          foreach ($Name in @('font-100-00-dashboard.png', 'font-100-01-live-traffic.png', 'font-100-04-history.png', 'font-100-06-storage.png', 'font-200-00-dashboard.png', 'font-200-04-history.png', 'font-200-08-settings.png')) {
            $Preview = Join-Path 'ui-previews' $Name
            if (Test-Path $Preview) { Write-Output ("DETECTOR_PREVIEW " + $Name + " " + [Convert]::ToBase64String([IO.File]::ReadAllBytes((Resolve-Path $Preview)))) }
          }
      - name: Synthetic application layout previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CylonDetector-0.1.0-synthetic-layout-previews
          path: Cylon-Detector/Windows/ui-previews/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Downloadable initial installer and provenance
        uses: actions/upload-artifact@v4
        with:
          name: CylonDetector-0.1.0-initial-Windows-x64
          path: Cylon-Detector/Windows/release-assets/*
          if-no-files-found: error
          retention-days: 14
      - name: Report exact source and validation limits
        run: |
          "Cylon Detector v0.1 initial installer built from $env:GITHUB_SHA." >> $env:GITHUB_STEP_SUMMARY
          "The downloadable artifact includes installer, portable ZIP, SHA256 checksums and build provenance." >> $env:GITHUB_STEP_SUMMARY
          "Synthetic measurement/history and native UI checks passed. Physical Windows desktop, service, upgrade and installer acceptance remain for testing; no release was replaced or published." >> $env:GITHUB_STEP_SUMMARY
